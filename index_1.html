<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F3EF; --side:#ECEAE4; --surface:#FFFFFF; --ink:#22211E; --muted:#6F6C63; --line:#DCD9D0;
  --hover:rgba(34,33,30,.06); --hover2:rgba(34,33,30,.11); --accent:#3F51A8; --accent-ink:#FFFFFF; --accent-soft:#E5E8F6;
  --danger:#B3402F; --code-bg:#F0EEE8; --user-bg:#E9E6DD; --scrim:rgba(20,19,16,.4);
  --tk-c:#8A867B; --tk-s:#2F7D4F; --tk-n:#B5622B; --tk-k:#3F51A8;
  --shadow:0 1px 2px rgba(30,28,20,.06),0 10px 28px -10px rgba(30,28,20,.16);
  --serif:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1D1C1A; --side:#161513; --surface:#262421; --ink:#ECE9E1; --muted:#9A968B; --line:#36332F;
    --hover:rgba(236,233,225,.07); --hover2:rgba(236,233,225,.13); --accent:#93A5F2; --accent-ink:#151824; --accent-soft:#2A3050;
    --danger:#E8836F; --code-bg:#1A1917; --user-bg:#302D29; --scrim:rgba(0,0,0,.6);
    --tk-c:#8A867B; --tk-s:#8FCB9E; --tk-n:#E2A16B; --tk-k:#93A5F2;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -10px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1D1C1A; --side:#161513; --surface:#262421; --ink:#ECE9E1; --muted:#9A968B; --line:#36332F;
  --hover:rgba(236,233,225,.07); --hover2:rgba(236,233,225,.13); --accent:#93A5F2; --accent-ink:#151824; --accent-soft:#2A3050;
  --danger:#E8836F; --code-bg:#1A1917; --user-bg:#302D29; --scrim:rgba(0,0,0,.6);
  --tk-c:#8A867B; --tk-s:#8FCB9E; --tk-n:#E2A16B; --tk-k:#93A5F2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -10px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:18px;height:18px;flex:none}
[hidden]{display:none!important}

.app{display:flex;height:100%;position:relative}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:0;border-radius:10px;background:none;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:500}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}

/* Sidebar */
.sidebar{width:288px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:margin-left .22s ease;min-height:0}
.app.collapsed .sidebar{margin-left:-288px}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:12px 10px 6px 16px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-size:22px;font-weight:500;letter-spacing:-.01em}
.brand .ic{width:22px;height:22px;color:var(--accent)}
.side-actions{padding:6px 10px;display:flex;flex-direction:column;gap:8px}
.new-chat{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:0;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.new-chat:hover{filter:brightness(.97)}
.search{display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:10px;color:var(--muted)}
.search:focus-within{background:var(--hover)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;color:var(--ink);font:15px var(--sans);padding:8px 0}
.search input::placeholder{color:var(--muted)}
.list{flex:1;overflow-y:auto;padding:4px 8px 12px;min-height:0}
.sec{display:flex;align-items:center;justify-content:space-between;padding:14px 8px 4px;color:var(--muted);font-size:13px;font-weight:500}
.sec .icon-btn{width:26px;height:26px;border-radius:8px}
.item{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 10px;border-radius:10px;cursor:pointer;min-height:36px;position:relative}
.item:hover{background:var(--hover)}
.item.active{background:var(--hover2)}
.item.nested{margin-left:14px}
.item .it{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .ic{color:var(--muted)}
.item .more{opacity:0;border:0;background:none;padding:2px;border-radius:6px;color:var(--muted);display:inline-flex}
.item:hover .more,.item:focus-within .more,.item.active .more{opacity:1}
.item .more:hover{background:var(--hover2);color:var(--ink)}
@media (hover:none){.item .more{opacity:1}}
.starmark svg{fill:currentColor;width:13px;height:13px}
.note{padding:8px 10px;color:var(--muted);font-size:13.5px}
.side-foot{display:flex;align-items:center;gap:10px;padding:10px 10px 12px 14px;border-top:1px solid var(--line)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.who{flex:1;font-size:13px;color:var(--muted);line-height:1.3}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;min-height:0}
.topbar{height:52px;display:flex;align-items:center;gap:4px;padding:0 10px;flex:none}
.app:not(.collapsed) #openSide{display:none}
.title-btn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:6px 10px;border-radius:10px;max-width:min(520px,70vw);font-weight:500}
.title-btn:hover{background:var(--hover)}
.title-btn span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title-btn .pj{color:var(--muted);font-weight:400}
.banner{margin:0 16px 8px;padding:10px 14px;border:1px solid var(--line);background:var(--surface);border-radius:12px;color:var(--muted);font-size:14px}
.thread{flex:1;overflow-y:auto;padding:4px 16px 28px;min-height:0;overscroll-behavior:contain}
.col{max-width:720px;margin:0 auto}
.main.empty .thread{display:flex;align-items:flex-end;justify-content:center;padding-bottom:22px}
.main.empty .col{width:100%}
.hero{text-align:center;padding:0 4px}
.hero .logo{display:inline-grid;place-items:center;color:var(--accent);margin-bottom:14px}
.hero .logo .ic{width:34px;height:34px}
.hero h1{font:400 clamp(28px,5.2vw,40px)/1.15 var(--serif);letter-spacing:-.015em;margin:0}
.hero p{margin:10px 0 0;color:var(--muted)}
.composer-wrap{padding:0 16px 8px;flex:none}
.composer{max-width:720px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:8px 10px 8px 12px;transition:border-color .15s}
.composer:focus-within{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.composer.drag{border-color:var(--accent);background:var(--accent-soft)}
.composer textarea{display:block;width:100%;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font:16px/1.5 var(--sans);padding:8px 4px;max-height:220px;min-height:28px}
.composer textarea::placeholder{color:var(--muted)}
.cbar{display:flex;align-items:center;gap:4px}
.cbar .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);padding:6px 10px;border-radius:10px;font-size:14px;max-width:44vw}
.pill:hover{background:var(--hover);color:var(--ink)}
.pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .ic{width:15px;height:15px}
.send{width:36px;height:36px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.send:disabled{background:var(--hover2);color:var(--muted);cursor:default}
.send.stop .ic{fill:currentColor}
.attach-row{display:flex;flex-wrap:wrap;gap:8px;padding:2px 2px 6px}
.fchip{display:inline-flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:5px 6px 5px 10px;font-size:13.5px;max-width:100%}
.fchip img{width:28px;height:28px;border-radius:7px;object-fit:cover}
.fchip span{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip button{border:0;background:none;color:var(--muted);display:inline-flex;padding:2px;border-radius:6px}
.fchip button:hover{color:var(--ink);background:var(--hover)}
.fine{text-align:center;color:var(--muted);font-size:12.5px;padding:8px 16px 10px}
.chips-wrap{flex:1;display:none;justify-content:center;align-content:flex-start;flex-wrap:wrap;gap:8px;padding:6px 16px 20px;min-height:0;overflow:auto}
.main.empty .chips-wrap{display:flex}
.main.empty .fine{display:none}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-size:14px;color:var(--ink);height:fit-content}
.chip:hover{background:var(--surface)}

/* Messages */
.msg{margin:22px 0}
.msg.user{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.bubble{background:var(--user-bg);border-radius:20px;padding:10px 16px;max-width:88%;white-space:pre-wrap;word-break:break-word;font-size:16px;line-height:1.5}
.bubble-files{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;max-width:88%}
.bubble-files .fchip{padding:5px 10px}
.bubble-files img.big{width:120px;height:120px;border-radius:14px;object-fit:cover}
.actions{display:flex;gap:2px;opacity:0;transition:opacity .15s;margin-left:-6px}
.msg.user .actions{margin-left:0;margin-right:-6px}
.msg:hover .actions,.msg:focus-within .actions,.msg.last .actions{opacity:1}
@media (hover:none){.actions{opacity:1}}
.actions .icon-btn{width:30px;height:30px;border-radius:8px}
.actions .icon-btn .ic{width:16px;height:16px}
.actions .on{color:var(--accent)}
.edit-box{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow)}
.edit-box textarea{width:100%;border:0;outline:0;resize:vertical;background:none;color:var(--ink);font:16px/1.5 var(--sans);min-height:70px}
.edit-box .row{display:flex;justify-content:flex-end;gap:8px}
.tag{color:var(--muted);font-size:13.5px;margin-top:6px}
.err{margin-top:10px;border:1px solid color-mix(in srgb,var(--danger) 40%,var(--line));background:color-mix(in srgb,var(--danger) 8%,transparent);border-radius:12px;padding:10px 12px;font:14.5px/1.45 var(--sans);display:flex;gap:10px;align-items:center;justify-content:space-between}
.err .btn{padding:5px 12px;font-size:14px;flex:none}
.thinking{display:inline-flex;gap:5px;padding:10px 0;align-items:center;color:var(--muted);font:14px var(--sans)}
.thinking i{width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:.35;animation:pulse 1.2s infinite ease-in-out}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
.thinking em{font-style:normal;margin-left:6px}
@keyframes pulse{0%,80%,100%{opacity:.25;transform:scale(.85)}40%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.thinking i{animation:none;opacity:.7}.sidebar{transition:none}}

.prose{font:17.5px/1.68 var(--serif);word-break:break-word}
.prose>:first-child{margin-top:0}
.prose>:last-child{margin-bottom:0}
.prose p{margin:0 0 .95em}
.prose h1,.prose h2,.prose h3,.prose h4{font-family:var(--serif);font-weight:600;line-height:1.3;margin:1.3em 0 .5em;letter-spacing:-.005em}
.prose h1{font-size:1.45em}.prose h2{font-size:1.28em}.prose h3{font-size:1.1em}.prose h4{font-size:1em}
.prose ul,.prose ol{margin:0 0 .95em;padding-left:1.5em}
.prose li{margin:.3em 0}
.prose li>p{margin:.3em 0}
.prose a{color:var(--accent);text-underline-offset:2px}
.prose blockquote{margin:0 0 .95em;padding:.1em 0 .1em 1em;border-left:3px solid var(--line);color:var(--muted)}
.prose hr{border:0;border-top:1px solid var(--line);margin:1.4em 0}
.prose table{display:block;overflow-x:auto;max-width:100%;border-collapse:collapse;margin:0 0 1em;font:15px/1.5 var(--sans)}
.prose th,.prose td{border:1px solid var(--line);padding:7px 12px;text-align:left;vertical-align:top}
.prose th{background:var(--code-bg);font-weight:600}
.prose :not(pre)>code{font:.86em var(--mono);background:var(--code-bg);padding:.14em .38em;border-radius:6px}
.prose img{max-width:100%}
.codeblock{margin:1em 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--code-bg);font-family:var(--mono)}
.cb-head{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 4px 14px;color:var(--muted);font:13px var(--sans);border-bottom:1px solid var(--line)}
.cb-acts{display:flex;gap:2px}
.cb-acts button{border:0;background:none;color:var(--muted);font:13px var(--sans);padding:4px 9px;border-radius:7px}
.cb-acts button:hover{background:var(--hover2);color:var(--ink)}
.codeblock pre{margin:0;padding:12px 14px;overflow-x:auto;font:13.5px/1.6 var(--mono);tab-size:2}
.tk-c{color:var(--tk-c);font-style:italic}.tk-s{color:var(--tk-s)}.tk-n{color:var(--tk-n)}.tk-k{color:var(--tk-k)}

/* Artifact panel */
.artifact{width:46%;max-width:780px;flex:none;border-left:1px solid var(--line);background:var(--surface);display:none;flex-direction:column;min-width:0}
.app.art-open .artifact{display:flex}
.art-head{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
.art-title{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:none;padding:4px 12px;border-radius:8px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.art-body{flex:1;min-height:0;position:relative}
.art-body iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.art-body pre{position:absolute;inset:0;margin:0;padding:14px;overflow:auto;font:13.5px/1.6 var(--mono);background:var(--code-bg);white-space:pre}

/* Menus, modals, toast */
.menu{position:fixed;z-index:80;min-width:220px;max-width:min(320px,92vw);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:var(--shadow)}
.menu button{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:9px;border:0;background:none}
.menu button:hover{background:var(--hover)}
.menu button.danger{color:var(--danger)}
.menu .mi{flex:1;display:flex;flex-direction:column}
.menu .md{color:var(--muted);font-size:13px}
.menu .ic{margin-top:2px;color:var(--muted)}
.menu button.danger .ic{color:inherit}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.mscrim{position:fixed;inset:0;z-index:90;background:var(--scrim);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);width:min(460px,100%);max-height:88vh;overflow:auto;padding:20px}
.modal h2{margin:0 0 14px;font:500 22px var(--serif)}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.field{margin-bottom:14px}
.field label{display:block;font-weight:500;margin-bottom:6px;font-size:14px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 12px;font:16px var(--sans);outline:0}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field textarea{min-height:110px;resize:vertical}
.field small{display:block;color:var(--muted);margin-top:5px}
.field .row{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);max-width:90vw}
.scrim{display:none}

@media (max-width:820px){
  #openSide{display:inline-flex!important}
  .sidebar{position:fixed;z-index:50;top:0;bottom:0;left:0;width:min(320px,86vw);margin-left:0!important;transform:translateX(-105%);transition:transform .22s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:var(--shadow)}
  .app.side-open .sidebar{transform:none}
  .app.side-open .scrim{display:block;position:fixed;inset:0;z-index:45;background:var(--scrim)}
  .artifact{position:fixed;inset:0;z-index:55;width:100%;max-width:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .prose{font-size:17px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Sidebar">
    <div class="side-top">
      <div class="brand"><span data-icon="spark"></span>Lumen</div>
      <button class="icon-btn" data-action="toggle-side" data-icon="panel-left" aria-label="Close sidebar"></button>
    </div>
    <div class="side-actions">
      <button class="new-chat" data-action="new-chat"><span data-icon="plus"></span>New chat</button>
      <label class="search"><span data-icon="search"></span><input id="search" type="search" placeholder="Search chats" autocomplete="off" aria-label="Search chats"></label>
    </div>
    <nav class="list" id="list" aria-label="Chats"></nav>
    <div class="side-foot">
      <div class="avatar">Y</div>
      <div class="who">Chats are saved in this browser</div>
      <button class="icon-btn" data-action="settings" data-icon="sliders" aria-label="Settings"></button>
    </div>
  </aside>
  <div class="scrim" data-action="toggle-side"></div>

  <main class="main empty" id="main">
    <header class="topbar">
      <button class="icon-btn" id="openSide" data-action="toggle-side" data-icon="panel-left" aria-label="Open sidebar"></button>
      <button class="title-btn" id="titleBtn" data-action="chat-title-menu" hidden><span id="titleText"></span><span data-icon="chevron-down"></span></button>
    </header>
    <div class="thread" id="thread"><div class="col" id="msgs"></div></div>
    <div class="composer-wrap">
      <div class="composer" id="composer">
        <div class="attach-row" id="attachRow" hidden></div>
        <textarea id="input" rows="1" placeholder="Message Lumen" aria-label="Message"></textarea>
        <div class="cbar">
          <button class="icon-btn" data-action="attach" data-icon="paperclip" aria-label="Attach files"></button>
          <button class="pill" id="projChip" data-action="clear-project" hidden title="Remove from project"><span data-icon="folder"></span><span id="projChipText"></span><span data-icon="x"></span></button>
          <button class="pill" id="styleBtn" data-action="style-menu" aria-haspopup="menu"><span data-icon="pen"></span><span id="styleLabel">Style</span></button>
          <span class="sp"></span>
          <button class="pill" id="modelBtn" data-action="model-menu" aria-haspopup="menu"><span id="modelLabel">Balanced</span><span data-icon="chevron-down"></span></button>
          <button class="send" id="sendBtn" data-action="send" aria-label="Send message" disabled></button>
        </div>
      </div>
      <input type="file" id="file" multiple hidden>
    </div>
    <div class="chips-wrap" id="chips"></div>
    <div class="fine">Powered by Claude. Replies can contain mistakes, so check anything important.</div>
  </main>

  <aside class="artifact" id="artifact" aria-label="Preview">
    <div class="art-head">
      <div class="art-title" id="artTitle">Preview</div>
      <div class="seg" role="group" aria-label="View">

const IMG_LIMITS = { maxCount: 3, maxInputBytes: 1000000, mediaTypes: ['image/jpeg', 'image/png', 'image/gif', 'image/webp'] };

  r.onerror = () => reject({ code: 'image_rejected', message: 'unreadable image' });

});
async function apiSample(input, opts = {}) {
  const images = opts.images ? await Promise.all(opts.images.map(blobToImage)) : [];

  try {
    res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: opts.signal, body: JSON.stringify({ messages: input, tier: opts.modelTier || 'default', images }) });
  } catch (e) {
    if (e && e.name === 'AbortError') throw { code: 'cancelled', message: 'cancelled' };

    let detail = ''; try { const j = await res.json(); detail = j.detail || j.error || ''; } catch (e) {}

const KW = new Set('const let var function return if else elif for while do class import from export default new this async await try catch except finally throw raise def in of is not and or None True False null undefined true false public private protected static void int float double string bool boolean struct fn pub use mod match enum interface type extends implements print lambda with as yield switch case break continue package go func SELECT FROM WHERE JOIN INSERT UPDATE DELETE CREATE TABLE'.split(' '));
function highlight(code, lang) {
  lang = (lang || '').toLowerCase();
  if (!lang || ['text', 'txt', 'plaintext', 'markdown', 'md', 'diff', 'log', 'csv'].includes(lang) || code.length > 20000) return esc(code);
  const hash = ['py', 'python', 'sh', 'bash', 'shell', 'zsh', 'yaml', 'yml', 'ruby', 'rb', 'toml', 'r', 'dockerfile', 'perl'].includes(lang);
  const re = hash
    ? /(#[^\n]*)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]+)\b/g
    : /(\/\*[\s\S]*?\*\/|\/\/[^\n]*|<!--[\s\S]*?-->)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]+)\b/g;
  let out = '', last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    if (m[1] !== undefined) out += `<span class="tk-c">${esc(m[0])}</span>`;
    else if (m[2] !== undefined) out += `<span class="tk-s">${esc(m[0])}</span>`;
    else if (m[3] !== undefined) out += `<span class="tk-n">${esc(m[0])}</span>`;
    else out += KW.has(m[4]) ? `<span class="tk-k">${esc(m[0])}</span>` : esc(m[0]);
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}

        const prev = /^(html|svg)$/i.test(lang);
        return `<div class="codeblock"><div class="cb-head"><span>${esc(lang || 'code')}</span><span class="cb-acts">${prev ? '<button type="button" data-action="preview-code">Preview</button>' : ''}<button type="button" data-action="copy-code">Copy</button></span></div><pre><code>${highlight(text, lang)}</code></pre></div>`;

}

  document.body.appendChild(t);

async function copyText(text) {

}

/* ---------- Prompt building & sending ---------- */
function preamble(proj) {
  const st = STYLES[store.settings.style].text;
  return [
    'You are a helpful, honest, thoughtful AI assistant inside a chat app. Answer the latest message directly, using the conversation so far as context.',
    'Format with Markdown only when it helps: short paragraphs for conversation, lists and tables for structured content, and fenced code blocks with a language tag for code.',
    'If asked to build a web page, app, game, tool or visual, reply with ONE complete self-contained HTML file in a single ```html block (inline CSS and JS, no external resources except scripts from cdnjs.cloudflare.com), followed by a brief note on how it works.',
    st ? 'Response style: ' + st : '',
    proj && proj.instructions ? 'Project instructions from the user (follow them):\n' + proj.instructions : '',
    'Today is ' + new Date().toDateString() + '.'
  ].filter(Boolean).join('\n');
}
function userContent(m) {
  let s = '';
  (m.files || []).forEach(f => { s += f.kind === 'text' ? `[Attached file: ${f.name}]\n\`\`\`\n${f.text}\n\`\`\`\n\n` : `[Attached image: ${f.name}]\n\n`; });
  return s + (m.content || '(see attachment)');
}
function buildInput(chat, upto) {
  const pre = preamble(projOf(chat.projectId));
  const enc = new TextEncoder();
  const bytes = s => enc.encode(s).length;
  let turns = chat.messages.slice(0, upto + 1).filter(m => m.content || (m.files && m.files.length)).map(m => ({ role: m.role, content: m.role === 'user' ? userContent(m) : m.content }));
  let budget = 58000 - bytes(pre) - 400;
  const kept = [];
  for (let i = turns.length - 1; i >= 0; i--) {
    const t = turns[i]; const sz = bytes(t.content);
    if (sz > budget) { if (!kept.length) { kept.unshift({ role: t.role, content: t.content.slice(0, Math.max(500, Math.floor(budget * .8))) }); } break; }
    kept.unshift(t); budget -= sz;
  }
  while (kept.length && kept[0].role !== 'user') kept.shift();
  const merged = [];
  kept.forEach(t => { const l = merged[merged.length - 1]; if (l && l.role === t.role) l.content += '\n\n' + t.content; else merged.push({ ...t }); });
  if (!merged.length) return null;
  merged[0].content = pre + '\n\n---\n\n' + merged[0].content;
  return merged;
}
const ERR = {
  not_granted: 'Access to Claude was declined for this page. Reload it and choose Allow to chat.',
  sampling_disabled: 'Claude isn\'t available for this account or organization.',
  rate_limited: 'You\'ve reached a usage limit. Wait a while, then retry.',
  session_expired: 'Your session expired. Sign in to Claude again, then retry.',
  refused: 'Claude declined to answer this. Try rewording your request.',
  empty_completion: 'No reply came back. Try rewording, or ask for less at once.',
  prompt_too_large: 'This conversation is too long. Start a new chat to continue.',
  image_rejected: 'That image couldn\'t be used. Try a different file.',
  unavailable: 'The chat server isn\'t reachable. Try again in a moment.',
  capability_disabled: 'Replies aren\'t available in this view.',
  upstream_error: 'The connection dropped. Retry to try again.'
};

async function send(text) {
  if (ui.streaming) { toast('Wait for the current reply to finish, or stop it.'); return; }
  text = (text || '').trim();
  if (!text && !ui.files.length) return;
  let c = cur();
  if (!c) { c = createChat(ui.draftProject); ui.cur = c.id; ui.draftProject = null; store.lastId = c.id; }
  const files = ui.files; ui.files = [];
  const um = { id: uid(), role: 'user', content: text, files: files.map(f => ({ name: f.name, kind: f.kind, text: f.text })) };
  const imgs = files.filter(f => f.kind === 'image');
  if (imgs.length) imgBlobs.set(um.id, imgs.map(f => ({ name: f.name, blob: f.blob, url: f.url })));
  c.messages.push(um);
  if (c.messages.length === 1) c.title = (text || files[0].name).replace(/\s+/g, ' ').slice(0, 48);
  c.updated = Date.now();
  inputEl.value = ''; autosize();
  ui.stick = true;
  await run(c);
}
async function run(c) {
  const am = { id: uid(), role: 'assistant', content: '', pending: true };
  c.messages.push(am);
  const ctl = new AbortController();
  ui.streaming = { chatId: c.id, msgId: am.id, ctl };
  save(); renderAll(); scrollBottom(true);
  const upto = c.messages.length - 2;
  const tier = store.settings.tier;
  let raf = 0;
  const paint = () => {
    raf = 0;
    const el = $(`.msg[data-id="${am.id}"] .prose`);
    if (el) { el.innerHTML = renderMd(am.content); scrollBottom(); }
  };
  try {
    const sample = await getSample();
    if (!sample) throw { code: 'unavailable' };
    const input = buildInput(c, upto);
    if (!input) throw { code: 'invalid_request' };
    const opts = { cache: false, signal: ctl.signal, modelTier: tier, onText: ({ text }) => { am.content = text; am.pending = false; if (!raf) raf = requestAnimationFrame(paint); } };
    const lastUser = c.messages[upto];
    const blobs = lastUser && imgBlobs.get(lastUser.id);
    if (blobs && blobs.length && ui.limits && ui.limits.images) opts.images = blobs.map(b => b.blob);
    const r = await sample(input, opts);
    am.content = r.text;
    if (r.truncated) am.note = 'The reply was cut short. Say "continue" to keep going.';
    if (r.modelTierApplied && r.modelTierApplied !== tier) toast(`Answered on ${TIERS[r.modelTierApplied].label}; your plan didn't allow ${TIERS[tier].label}.`);
  } catch (e) {
    if (typeof e.text === 'string' && e.text) am.content = e.text;
    if (e && e.code === 'cancelled') am.stopped = true;
    else if (e && e.code === 'refused') { am.content = ''; am.error = ERR.refused; }
    else am.error = ERR[e && e.code] || (e && e.code === 'invalid_request' ? 'Something in this chat couldn\'t be sent. Try a new chat.' : ERR.upstream_error)
    if (am.error && e && e.detail) am.error += ' Details: ' + e.detail;
  } finally {
    if (raf) cancelAnimationFrame(raf);
    am.pending = false; ui.streaming = null; c.updated = Date.now();
    if (am.stopped && !am.content) { c.messages = c.messages.filter(m => m.id !== am.id); }
    save();
    if (ui.cur === c.id) { renderMessages(); updateSendBtn(); scrollBottom(); }
    renderSidebar();
    autoArtifact(am);
  }
}
function stop() { if (ui.streaming) ui.streaming.ctl.abort(); }
function retry(id) {
  if (ui.streaming) return;
  const c = cur(); if (!c) return;
  const i = c.messages.findIndex(m => m.id === id); if (i < 0) return;
  c.messages = c.messages.slice(0, i);

}

const TEXT_EXT = /\.(txt|md|markdown|csv|tsv|json|jsonl|js|mjs|ts|tsx|jsx|py|html|htm|css|scss|xml|yaml|yml|toml|ini|log|sql|sh|bash|java|c|h|cpp|hpp|cs|go|rs|rb|php|swift|kt|r|tex)$/i;
async function addFiles(list) {
  for (const f of list) {
    if (ui.files.length >= 6) { toast('You can attach up to 6 files.'); break; }
    if (f.type.startsWith('image/')) {
      const lim = ui.limits && ui.limits.images;
      if (!lim) { toast('Images aren\'t available in this view.'); continue; }
      if (lim.mediaTypes && !lim.mediaTypes.includes(f.type)) { toast(`${f.name || 'Image'}: this image type isn't supported.`); continue; }
      if (f.size > lim.maxInputBytes) { toast(`${f.name || 'Image'} is too large.`); continue; }
      if (ui.files.filter(x => x.kind === 'image').length >= lim.maxCount) { toast(`You can attach up to ${lim.maxCount} images.`); continue; }
      ui.files.push({ id: uid(), name: f.name || 'pasted-image', kind: 'image', blob: f, url: URL.createObjectURL(f) });
    } else if (f.type.startsWith('text/') || TEXT_EXT.test(f.name) || /json|xml|javascript/.test(f.type)) {
      let t = await f.text();
      if (t.length > 20000) t = t.slice(0, 20000) + '\n[File truncated]';
      ui.files.push({ id: uid(), name: f.name, kind: 'text', text: t });
    } else toast(`${f.name}: only text and image files are supported.`);
  }
  renderAttach();
}

    case 'clear-project': if (!cur()) { ui.draftProject = null; renderMain(); } break;
    case 'model-menu': showMenu(t, Object.entries(TIERS).map(([k, v]) => ({ label: v.label, desc: v.desc, checked: store.settings.tier === k, onClick: () => { store.settings.tier = k; save(); renderComposerMeta(); } }))); break;
    case 'style-menu': showMenu(t, Object.entries(STYLES).map(([k, v]) => ({ label: v.label, desc: v.desc, checked: store.settings.style === k, onClick: () => { store.settings.style = k; save(); renderComposerMeta(); } }))); break;
    case 'suggest': inputEl.value = t.dataset.text; autosize(); inputEl.focus(); break;
    case 'copy-msg': { const c = cur(); const m = c && c.messages.find(x => x.id === id); if (m) toast(await copyText(m.content) ? 'Copied' : 'Couldn\'t copy'); break; }
    case 'like': case 'dislike': { const c = cur(); const m = c && c.messages.find(x => x.id === id); if (m) { const v = a === 'like' ? 'up' : 'down'; m.fb = m.fb === v ? null : v; save(); renderMessages(); if (m.fb) toast('Thanks for the feedback'); } break; }
    case 'retry': retry(id); break;
    case 'edit-msg': if (!ui.streaming) { ui.editing = id; renderMessages(); } break;
    case 'edit-cancel': ui.editing = null; renderMessages(); break;
    case 'edit-save': saveEdit(id); break;
    case 'copy-code': { const code = t.closest('.codeblock').querySelector('code').textContent; const ok = await copyText(code); const old = t.textContent; t.textContent = ok ? 'Copied' : 'Failed'; setTimeout(() => { t.textContent = old; }, 1400); break; }
    case 'preview-code': { const cb = t.closest('.codeblock'); const lang = cb.querySelector('.cb-head span').textContent.toLowerCase(); openArtifact(cb.querySelector('code').textContent, lang); break; }
    case 'art-close': closeArtifact(); break;
    case 'art-tab': if (ui.art) { ui.art.tab = t.dataset.tab; renderArtifact(); } break;
    case 'art-copy': if (ui.art) toast(await copyText(ui.art.code) ? 'Code copied' : 'Couldn\'t copy'); break;
    case 'art-download': if (ui.art) saveFile(slug(ui.art.title) + (ui.art.lang === 'svg' ? '.svg' : '.html'), ui.art.code, true); break;
  }
});

/* ---------- Init ---------- */
applyTheme();
if (store.lastId && store.chats.some(c => c.id === store.lastId)) ui.cur = store.lastId;
renderAll(); scrollBottom(true); autosize();
})();
</script>
</body>
